version: '3.8'

services:
  # Database Service
  db:
    image: mysql:8.0
    container_name: webdev_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-web_platform}
      MYSQL_USER: ${MYSQL_USER:-webdev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webdevpass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - webdev_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PHP Application
  app:
    build:
      context: ..
      dockerfile: WebDev/Dockerfile
    container_name: webdev_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-web_platform}
      DB_USER: ${MYSQL_USER:-webdev}
      DB_PASS: ${MYSQL_PASSWORD:-webdevpass}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
    networks:
      - webdev_network

  # phpMyAdmin (Optional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webdev_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8081:80"
    networks:
      - webdev_network

networks:
  webdev_network:
    driver: bridge

volumes:
  db_data: